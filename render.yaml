services:
  - type: web
    name: shop-burmalda
    runtime: node
    plan: free
    buildCommand: node scripts/build.mjs
    startCommand: node --disable-warning=ExperimentalWarning local.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SELLER_PASSWORD
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: D1_API_TOKEN
        sync: false
